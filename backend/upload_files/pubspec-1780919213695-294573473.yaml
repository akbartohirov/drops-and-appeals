name: calory_tracker
description: "Smart Calorie & Weight Tracker — shaxsiy foydalanish uchun"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # State Management — Riverpod (without code gen, manual providers)
  flutter_riverpod: ^2.6.1

  # Local Database — Hive (oflayn, tez, Flutter native)
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0

  # Image
  image_picker: ^1.1.2

  # Navigation
  go_router: ^14.6.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
