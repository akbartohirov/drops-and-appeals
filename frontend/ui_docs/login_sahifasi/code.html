<style>
        body {
            background-color: #F4F7F9;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            border: 1px solid #E5E7EB;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

<body class="flex items-center justify-center min-h-screen p-4 min-h-screen">
<!-- Background Pattern/Atmosphere -->
<div class="fixed inset-0 -z-10 overflow-hidden">
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary-container/5 rounded-full blur-3xl -mr-64 -mt-64"></div>
<div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-tertiary-fixed-dim/5 rounded-full blur-3xl -ml-64 -mb-64"></div>
</div>
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Logo & Branding -->

<!-- Login Form Card -->
<div class="bg-white p-8 rounded-xl login-card">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-6">Tizimga kirish</h2>
<form action="#" class="space-y-5" id="loginForm" method="POST">
<!-- Username Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="username">Foydalanuvchi nomi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all" id="username" name="username" placeholder="admin_123" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Parol</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Parolni unutdingizmi?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Policy -->
<div class="flex items-center">
<input class="w-4 h-4 text-primary-container border-outline-variant rounded focus:ring-primary-container" id="remember" name="remember" type="checkbox">
<label class="ml-2 font-body-md text-body-md text-on-surface-variant select-none" for="remember">Meni eslab qol</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-label-md text-label-md py-4 rounded-lg hover:bg-primary transition-all active:scale-[0.98] shadow-sm flex items-center justify-center gap-2" type="submit">
<span class="">Kirish</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>

</div>
<!-- Footer Info -->

</main>
<!-- Language Selector Overlay (Bottom Right) -->
<div class="fixed bottom-6 right-6">
<div class="relative group">
<button class="flex items-center gap-2 bg-white border border-outline-variant px-4 py-2 rounded-full font-label-md text-label-md text-on-surface shadow-sm hover:bg-surface transition-all">
<span class="material-symbols-outlined text-[18px]">language</span>
<span>O'zbekcha</span>
<span class="material-symbols-outlined text-[18px]">expand_less</span>
</button>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Mock interaction for form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Tekshirilmoqda...</span>
            `;

            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    <span>Xush kelibsiz!</span>
                `;
                btn.classList.remove('bg-primary-container');
                btn.classList.add('bg-emerald-600');
            }, 1500);
        });
    </script>
